# --- Utah statutes ---

- id: sb149-learning-lab-and-ai-defense
  regulation: us-ut-legislature-statute-2024-sb149
  authority: utah-legislature
  source_file: data/examples/instruments/us-ut-legislature-statute-2024-sb149.md
  source_heading: Summary
  obligation_qualification: The learning-lab-agreement-participation text describes the regime as amended by HB 320 (2026), including joint interpretation agreements, a 36-month maximum, and governmental-entity counterparties; SB 149 as enacted provided regulatory mitigation agreements only, a 24-month maximum (12 months plus a single 12-month extension), and agency counterparties.
  obligations:
    - learning-lab-agreement-participation
    - ai-defense-elimination

