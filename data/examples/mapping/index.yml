- id: hb452-mental-health-chatbot-stack
  regulation: us-ut-legislature-statute-2025-hb452
  authority: utah-legislature
  source_file: data/examples/instruments/us-ut-legislature-statute-2025-hb452.md
  source_heading: Summary
  obligation_qualification: The disclose-genai-on-first-session mapping is related, not equivalent. HB 452 section 13-72a-203(2) requires disclosure before access, at the start of an interaction after seven days without access, and whenever the user asks or prompts; the obligation's per-session and 30-minute re-display terms are not statutory, and section 13-75-103(1) is the separate SB 226 on-request rule.
  obligations:
    - disclose-genai-on-first-session
    - chatbot-data-no-third-party-sharing
    - chatbot-safety-policy-filing

