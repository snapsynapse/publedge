name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHECK_OF_REQUIRED: "1"
      OBLIGATION_FIRST_DIR: ${{ github.workspace }}/obligation-first

    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: snapsynapse/obligation-first
          ref: a848817d9331bb3aa17cb0d6c5cd059d3ca53c1c
          path: obligation-first

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Obligation-First dependencies
        run: npm ci --prefix obligation-first

      - name: Run canonical CI verification
        run: npm run verify:ci

  a11y:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Build site
        run: npm run build

      - name: Run skill-a11y-audit (WCAG 2.1 AA)
        uses: snapsynapse/skill-a11y-audit/.github/actions/scan@6af2c95a56ff058cddf0c6febc71512db1d6d19b # v3.1.0
        with:
          node-version: '22'
          serve-path: ./docs
          sitemap: http://localhost:8088/sitemap.xml
          sitemap-find: https://publedge.org
          sitemap-replace: http://localhost:8088
          sitemap-exclude: '\.(md|yaml|json|jsonld|ttl|xml|txt)$'
          fail-on: major

# GitHub Pages serves from main /docs. The build job ensures docs/ stays
# in sync with sources; the a11y job scans every HTML URL in the generated
# sitemap tree and blocks confirmed major findings or inconclusive major evidence.
